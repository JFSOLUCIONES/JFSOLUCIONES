name: JF SALES V2 - Tests sin credenciales
on:
  push:
    branches: ["feature/jf-sales-agent-v2-*"]
    paths:
      - "src/comercial/**"
      - "test/sales_agent.test.js"
      - ".github/workflows/jf-sales-agent-ci.yml"
  pull_request:
    paths:
      - "src/comercial/**"
      - "test/sales_agent.test.js"
      - ".github/workflows/jf-sales-agent-ci.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test unitario (sin tokens ni WhatsApp)
        run: npm test
