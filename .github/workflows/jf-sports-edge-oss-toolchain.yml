name: JF SPORTS EDGE | OSS toolchain lab
on:
  workflow_dispatch:
  push:
    paths:
      - "sports-edge/research/oss-toolchain/**"
      - ".github/workflows/jf-sports-edge-oss-toolchain.yml"
  pull_request:
    paths:
      - "sports-edge/research/oss-toolchain/**"
      - ".github/workflows/jf-sports-edge-oss-toolchain.yml"
permissions:
  contents: read
jobs:
  ruff-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff pinned
        run: python -m pip install ruff==0.17.6
      - name: Ruff correctness rules
        run: |
          ruff check --select E4,E7,E9,F sports-edge/research/oss-toolchain/
          ruff format --check sports-edge/research/oss-toolchain/
  penaltyblog-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audited reference version
        run: python -m pip install penaltyblog==1.13.1
      - name: Compare Poisson and Dixon-Coles on synthetic fixtures
        run: python sports-edge/research/oss-toolchain/penaltyblog_smoke.py
