name: NO+ Editorial Core - Pruebas
on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "editorial/**"
      - ".github/workflows/editorial-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testear clasificador editorial sin credenciales
        run: npm test
